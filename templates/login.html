<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CampusHub</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <div class="login-logo">
                🚀 CampusHub
            </div>

            <h1>Welcome Back</h1>

            <p class="login-subtitle">
                Login to your CampusHub account
            </p>

            <form>

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
                 

                <a href="{{ url_for('dashboard') }}" class="login-btn">
                     Login →
                </a>  
            </form>

            <p class="back-home">
                <a href="{{ url_for('home') }}">
                    ← Back to Home
                </a>
            </p>

        </div>

    </div>

</body>

</html>
