<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Student | CampusHub</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🚀 CampusHub
        </div>

        <div class="nav-links">

            <a href="{{ url_for('dashboard') }}">
                Dashboard
            </a>

            <a href="{{ url_for('students') }}">
                Students
            </a>

        </div>

    </nav>


    <main class="add-student-page">

        <div class="form-card">

            <p class="tagline">
                STUDENT MANAGEMENT
            </p>

            <h1>Add New Student 👨‍🎓</h1>

            <p class="form-subtitle">
                Enter the student's details below.
            </p>


            <form method="POST"
                  action="{{ url_for('add_student') }}">

                <label for="name">
                    Student Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter student name"
                    required
                >


                <label for="roll_no">
                    Roll Number
                </label>

                <input
                    type="text"
                    id="roll_no"
                    name="roll_no"
                    placeholder="Enter roll number"
                    required
                >


                <label for="course">
                    Course
                </label>

                <input
                    type="text"
                    id="course"
                    name="course"
                    placeholder="e.g. CSE"
                    required
                >


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter student email"
                    required
                >


                <button type="submit"
                        class="form-submit-btn">
                    Add Student →
                </button>

            </form>


            <a href="{{ url_for('students') }}"
               class="back-link">
                ← Back to Students
            </a>

        </div>

    </main>

</body>

</html>
