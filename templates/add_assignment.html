<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Assignment | CampusHub</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🚀 CampusHub
        </div>

        <div class="nav-links">

            <a href="{{ url_for('dashboard') }}">
                Dashboard
            </a>

            <a href="{{ url_for('assignments') }}">
                Assignments
            </a>

        </div>

    </nav>


    <main class="add-student-page">

        <div class="form-card">

            <p class="tagline">
                ASSIGNMENT MANAGEMENT
            </p>

            <h1>Add Assignment 📝</h1>

            <p class="form-subtitle">
                Create a new assignment and set its deadline.
            </p>


            <form method="POST"
                  action="{{ url_for('add_assignment') }}">

                <label for="title">
                    Assignment Title
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="e.g. DBMS Lab Assignment"
                    required
                >


                <label for="subject">
                    Subject
                </label>

                <input
                    type="text"
                    id="subject"
                    name="subject"
                    placeholder="e.g. DBMS"
                    required
                >


                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    placeholder="Enter assignment details..."
                    rows="5"></textarea>


                <label for="due_date">
                    Due Date
                </label>

                <input
                    type="date"
                    id="due_date"
                    name="due_date"
                    required
                >


                <button
                    type="submit"
                    class="form-submit-btn">

                    Add Assignment →

                </button>

            </form>


            <a href="{{ url_for('assignments') }}"
               class="back-link">

                ← Back to Assignments

            </a>

        </div>

    </main>

</body>

</html>
