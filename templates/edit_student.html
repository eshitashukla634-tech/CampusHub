<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Student | CampusHub</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🚀 CampusHub
        </div>

        <div class="nav-links">

            <a href="{{ url_for('dashboard') }}">
                Dashboard
            </a>

            <a href="{{ url_for('students') }}">
                Students
            </a>

        </div>

    </nav>


    <main class="add-student-page">

        <div class="form-card">

            <p class="tagline">
                STUDENT MANAGEMENT
            </p>

            <h1>Edit Student ✏️</h1>

            <p class="form-subtitle">
                Update the student's information.
            </p>


            <form method="POST">

                <label for="name">
                    Student Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ student[1] }}"
                    required
                >


                <label for="roll_no">
                    Student ID
                </label>

                <input
                    type="text"
                    id="roll_no"
                    name="roll_no"
                    value="{{ student[2] }}"
                    required
                >


                <label for="course">
                    Department
                </label>

                <input
                    type="text"
                    id="course"
                    name="course"
                    value="{{ student[3] }}"
                    required
                >


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ student[4] }}"
                    required
                >


                <button
                    type="submit"
                    class="form-submit-btn">

                    Save Changes →

                </button>

            </form>


            <a href="{{ url_for('students') }}"
               class="back-link">

                ← Back to Students

            </a>

        </div>

    </main>

</body>

</html>
